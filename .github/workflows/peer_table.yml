# Weekly: today's yields of every company → peer_data/ (read by the mail's card).
# Needs the repository secret DATABASE_URL (Settings → Secrets and variables → Actions).
name: peer table

on:
  schedule:
    - cron: "17 5 * * 6"        # Saturday 05:17 UTC, markets closed, weekly prices final
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: peer-table
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Build the peer table
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python jobs/build_peer_table.py
      - name: Commit
        run: |
          git config user.name "peer-table-bot"
          git config user.email "actions@users.noreply.github.com"
          git add peer_data/peer_yields.csv peer_data/classification.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "peer table $(date -u +%F)"
            git pull --rebase
            git push
          fi
